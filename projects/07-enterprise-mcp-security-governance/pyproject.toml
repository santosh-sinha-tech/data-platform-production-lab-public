[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp-governance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "jsonschema==4.26.0", "pydantic==2.14.4"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
