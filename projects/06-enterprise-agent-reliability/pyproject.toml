[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-reliability-lab"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.162.0", "pydantic==2.14.3", "httpx==0.28.1", "pytest==9.2.0", "prometheus-client==0.26.0", "opentelemetry-api==1.45.2", "opentelemetry-sdk==1.45.2", "uvicorn==0.54.0"]

[project.scripts]
agent-lab = "agent_lab.experiments:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/agent-lab/config" = ["config/example.yaml", "config/scenarios.json"]
